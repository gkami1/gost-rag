  - id: named-12-2-bolt-300a
    question: Какой диаметр резьбы болта заземления нужен для изделия на ток 300 А по ГОСТу 12.2.007.0-75?
    gold_designation: ГОСТ 12.2.007.0-75
    gold_section: "3.3.5"
    answer_contains: ["М10"]
    note: табл. 1 — «св. 250 до 630» -> М 10; падежная форма «по ГОСТу»

  - id: named-5264-min-leg
