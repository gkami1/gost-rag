# Оценочный набор.
#
# Каждый вопрос указывает эталонный документ (`gold_designation`) и, если
# известно, пункт (`gold_section`). Пункт не обязателен: recall по документу
# считается всегда, по пункту — только там, где он задан.
#
# Вопросы `out_of_corpus: true` описывают то, чего в корпусе заведомо нет.
# На них правильный ответ — отказ; они меряют, не начинает ли система выдумывать.
#
# `answer_contains` — что обязано быть в ответе (проверяется только с --generate).
# Элемент — строка или список равноправных вариантов. Сравнение без учёта
# регистра, пробелов, «ё», десятичного разделителя и похожих кириллица/латиница
# («М6» = «M6»); число сравнивается целиком («7 мм» не совпадёт с «17 мм»).
# Эталон — значение из стандарта, а не из текстового слоя PDF: если слой
# распознан с ошибкой и модель её переписала, это честный провал системы.
#
# `split: tune|test` — часть для подбора порога отказа и часть для его проверки.
# Без явного значения часть выбирается по хэшу id (eval/run_eval.py, split_of).
#
# Корпус на 13.09.2026 (4 документа):
#   ГОСТ 12.2.007.0-75  ССБТ. Изделия электротехнические. Общие требования безопасности
#   ГОСТ 5264-80        Ручная дуговая сварка. Соединения сварные
#   ГОСТ 10549-80       Выход резьбы. Сбеги, недорезы, проточки и фаски
#   ГОСТ 24705-2004     Резьба метрическая. Основные размеры
#
# Обозначения записаны с дефисом-минусом и без разворачивания года (решение №1).
# В самих PDF встречается длинное тире («ГОСТ 24705—2004») — сверьте, что
# normalize.py приводит оба варианта к одной форме, иначе эталон не сойдётся
# с реестром и recall будет нулевым не из-за поиска.
#
# Пункты проставлены только там, где в документе есть иерархическая нумерация
# (12.2.007.0-75 и 24705-2004). В 5264-80 и 10549-80 пункты сквозные
# однозначные («5.», «13.»), и section-recall на них измерять бессмысленно —
# оставлено null.

questions:
  # ---------- ГОСТ 12.2.007.0-75 ----------
  - id: el-protection-classes
    question: Какие классы защиты электротехнических изделий от поражения электрическим током установлены?
    gold_designation: ГОСТ 12.2.007.0-75
    gold_section: "2.1"
    answer_contains: [["0I", "OI"], "III"]
    note: ответ — пять классов (0, 0I, I, II, III); с. 2

  - id: el-earth-resistance
    question: Какое максимальное сопротивление допускается между заземляющим болтом и доступной прикосновению металлической частью изделия?
    gold_designation: ГОСТ 12.2.007.0-75
    gold_section: "3.3.7"
    answer_contains: ["0,1 Ом"]
    note: 0,1 Ом; с. 6. Короткий числовой факт, хорошо ловит потерю единиц измерения

  - id: el-bolt-diameter-by-current
    question: Какой диаметр резьбы заземляющего болта нужен для изделия с номинальным током 100 А?
    gold_designation: ГОСТ 12.2.007.0-75
    gold_section: "3.3.5"
    answer_contains: ["М6"]
    note: |
      табл. 1, с. 5 — таблица, ради которой существует решение №4.
      В текстовом слое PDF она разобрана плохо ("Св. 4 ДО 6 м 3 10 7"),
      проверьте, что pdfplumber вытаскивает её как таблицу, а не россыпью.

  - id: el-control-surface-temp
    question: Какая предельная температура поверхности органов управления из металла?
    gold_designation: ГОСТ 12.2.007.0-75
    gold_section: "3.4.7"
    answer_contains: ["40"]
    note: 40 °C металл / 45 °C материалы с низкой теплопроводностью; с. 7

  - id: el-stop-button-color
    question: Какого цвета должен быть орган управления, которым выполняется останов изделия?
    gold_designation: ГОСТ 12.2.007.0-75
    gold_section: "3.4.8"
    answer_contains: ["красн"]
    note: красный; с. 7

  - id: el-conductor-colors
    question: Какой расцветкой изоляции обозначают проводники в цепях заземления?
    gold_designation: ГОСТ 12.2.007.0-75
    gold_section: "3.9.5"
    answer_contains: [["зелено-желт", "желто-зелен"]]
    note: зелено-жёлтая двухцветная; с. 10, последний пункт документа

  - id: el-safe-voltage-note
    question: Какое напряжение считается безопасным сверхнизким для электрических цепей?
    gold_designation: ГОСТ 12.2.007.0-75
    gold_section: "1.2"
    answer_contains: ["42"]
    note: |
      ответ в «Примечании» мелким шрифтом (42 В / 50 В без нагрузки, 12 В
      для ручных светильников), с. 2. Проверяет, не выбрасывает ли
      normalize.py примечания как служебный текст

  # ---------- ГОСТ 5264-80 ----------
  - id: weld-edge-offset
    question: Какое смещение свариваемых кромок допускается перед сваркой для деталей толщиной до 4 мм?
    gold_designation: ГОСТ 5264-80
    gold_section: null
    answer_contains: ["0,5"]
    note: п. 5, с. 29 — 0,5 мм

  - id: weld-convexity
    question: Какая выпуклость углового шва допускается относительно катета?
    gold_designation: ГОСТ 5264-80
    gold_section: null
    answer_contains: ["30"]
    note: п. 13, с. 30 — до 30 %

  - id: weld-min-leg
    question: Какой минимальный катет углового шва для стали с пределом текучести до 400 МПа при толщине элемента от 16 до 22 мм?
    gold_designation: ГОСТ 5264-80
    gold_section: null
    answer_contains: [["7 мм", "**7**"]]
    note: приложение 1, с. 31 — 7 мм. Таблица в приложении, а не в теле стандарта

  - id: weld-thickness-difference
    question: При какой разности толщин стыкуемых деталей сварку выполняют как для деталей одинаковой толщины?
    gold_designation: ГОСТ 5264-80
    gold_section: null
    note: табл. 55, с. 28

  - id: weld-t1-designation
    question: Что означает условное обозначение сварного соединения Т1?
    gold_designation: ГОСТ 5264-80
    gold_section: null
    answer_contains: ["тавров", "без скоса"]
    note: |
      табл. 1, с. 5 — тавровое без скоса кромок, односторонний шов, 2—40 мм.
      Смысл живёт в многостраничной таблице с рисунками; ответ проверяет
      и решение №4 (повтор заголовка при разрезании), и то, что чертежи
      не разбираются вообще

  # ---------- ГОСТ 10549-80 ----------
  - id: thread-runout-scope
    question: Для каких типов резьбы установлены размеры сбегов, недорезов и проточек?
    gold_designation: ГОСТ 10549-80
    gold_section: null
    answer_contains: ["трапецеидальн", "трубн"]
    note: п. 1, с. 1 (162) — метрическая, трубная цилиндрическая и коническая, дюймовая коническая, трапецеидальная

  - id: thread-runout-m-outer
    question: Какой сбег резьбы допускается для наружной метрической резьбы с шагом 1,5 мм при угле заборной части инструмента 20 градусов?
    gold_designation: ГОСТ 10549-80
    gold_section: null
    answer_contains: ["2,8"]
    note: |
      табл. 1, с. 2 (163). Числовой ответ в очень плотной таблице —
      именно тот случай, ради которого нужен реранкер, а не только dense

  - id: thread-groove-symmetric
    question: Когда допускается применять симметричные проточки без фаски?
    gold_designation: ГОСТ 10549-80
    gold_section: null
    answer_contains: ["2 мм"]
    note: п. 9, с. 11 (172) — при f не более 2 мм, радиус закругления с обеих сторон равен R

  - id: thread-trapezoid-multistart
    question: Как назначают ширину проточки для многозаходной трапецеидальной резьбы?
    gold_designation: ГОСТ 10549-80
    gold_section: null
    note: примечание к табл. 7, с. 10 (171)

  # ---------- поиск по ячейке таблицы ----------
  # Ответ — одна ячейка, а смысл её столбца есть только в шапке или на чертеже
  # («R» — радиус скругления по черт. 8). Шапки сканов в слое распознавания —
  # мусор («6. 3 •з 3 а я S» вместо «Шаг резьбы P»), и до 02.10.2026 eval этого
  # не видел: вопросы выше спрашивают о таблицах словами, которые есть в тексте.
  - id: table-inner-groove-radii-p1
    question: Какие радиусы скругления для внутренней метрической резьбы шагом 1?
    gold_designation: ГОСТ 10549-80
    gold_section: null
    answer_contains: ["1,0", "0,5"]
    note: |
      табл. 2 (продолжение), с. 4 (165): проточка тип 1 нормальная R = 1,0, R1 = 0,5;
      узкая R = 0,5, R1 = 0,3; тип 2 R2 = 2,0. Вопрос пользователя дословно;
      строка шага 1 — на странице «Продолжения табл. 2», без слов «внутренняя
      метрическая» в тексте страницы

  - id: table-inner-groove-narrow-width-p1
    question: Какая ширина узкой проточки для внутренней метрической резьбы с шагом 1 мм?
    gold_designation: ГОСТ 10549-80
    gold_section: null
    answer_contains: ["2,0"]
    note: табл. 2 (продолжение), с. 4 — f узкой проточки типа 1; нормальная — 4,0

  - id: table-inner-groove-diameter-p15
    question: Какой диаметр проточки для внутренней метрической резьбы с шагом 1,5 мм?
    gold_designation: ГОСТ 10549-80
    gold_section: null
    answer_contains: ["d+0,7"]
    note: табл. 2 (продолжение), с. 4 — d_f = d + 0,7 (объединённая ячейка для шагов 1,5 и 1,75)

  - id: table-inner-chamfer-p2
    question: Какой размер фаски для внутренней метрической резьбы с шагом 2 мм, если проточка не типа 2?
    gold_designation: ГОСТ 10549-80
    gold_section: null
    answer_contains: ["2,0"]
    note: табл. 2 (продолжение), с. 4 — фаска z «для всех других случаев» 2,0; с проточкой типа 2 — 3,0

  - id: table-pipe-groove-radius-half-inch
    question: Какой радиус R нормальной проточки для трубной цилиндрической резьбы 1/2 дюйма?
    gold_designation: ГОСТ 10549-80
    gold_section: null
    answer_contains: ["1,6"]
    note: |
      табл. 3, с. 5 — R = 1,6 (объединённая ячейка 1/2–7/8). Обозначение «1/2»
      в слое распознавания — «Va»: вопрос меряет и шапку, и тело таблицы

  - id: table-weld-c28-radius
    question: Какой радиус R для соединения С28 по ГОСТ 5264-80?
    gold_designation: ГОСТ 5264-80
    gold_section: null
    answer_contains: [["от s до 2s", "s...2s", "s–2s"]]
    note: табл. 3, с. 6 — «От s до 2s»; шапка горизонтальная, в ячейках чертежи

  # ---------- ГОСТ 24705-2004 ----------
  - id: metric-d2-formula
    question: По какой формуле вычисляют средний диаметр метрической резьбы?
    gold_designation: ГОСТ 24705-2004
    gold_section: "4.2"
    answer_contains: ["0,6495"]
    note: d2 = d − 0,6495P; с. 2. Формула, а не таблица — проверяет, выживают ли индексы при извлечении

  - id: metric-m10-diameters
    question: Чему равен средний диаметр резьбы М10 с шагом 1,5 мм?
    gold_designation: ГОСТ 24705-2004
    gold_section: "4.1"
    answer_contains: ["9,026"]
    note: 9,026 мм (табл. 1, с. 4). Длинная однородная таблица на 12 страниц

  - id: metric-d3-purpose
    question: Для чего приведены номинальные значения внутреннего диаметра резьбы по дну впадины?
    gold_designation: ГОСТ 24705-2004
    gold_section: "4.2"
    answer_contains: ["прочност"]
    note: примечание после формул — для расчётов прочности, с учётом верхнего отклонения es по ГОСТ 16093

  - id: metric-scope
    question: На какие резьбы распространяется стандарт основных размеров метрической резьбы?
    gold_designation: ГОСТ 24705-2004
    gold_section: "1"
    answer_contains: ["9150", "8724"]
    note: с. 1 — профиль по ГОСТ 9150, диаметры и шаги по ГОСТ 8724

  # ---------- различение близких документов ----------
  # Оба вопроса про «резьбу М10» и «проточку», но отвечают на них разные
  # стандарты. Если поиск путает 10549-80 и 24705-2004 — это видно здесь
  # и нигде больше.
  - id: disambig-groove-vs-diameter
    question: Какой диаметр проточки d_f для наружной метрической резьбы с шагом 1,5 мм?
    gold_designation: ГОСТ 10549-80
    gold_section: null
    answer_contains: ["d-2,2"]
    note: не путать с диаметрами самой резьбы из 24705-2004

  - id: disambig-inner-diameter
    question: Какой внутренний диаметр резьбы М12 с шагом 1,75 мм?
    gold_designation: ГОСТ 24705-2004
    gold_section: "4.1"
    answer_contains: ["10,106"]
    note: 10,106 мм. Не путать с недорезом/проточкой из 10549-80

  # ---------- вопросы, прямо называющие стандарт из корпуса ----------
